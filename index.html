<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Store POS</title>
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#6366f1"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="POS">
<style>
:root{
  --bg:#f3f5f8;--surface:#fff;--surface2:#f8fafc;--surface3:#eef2f6;--text:#0f172a;--muted:#64748b;--line:#e4e9f0;
  --accent:#6366f1;--accent-d:#4f46e5;--accent-soft:#e0e7ff;--accent-ink:#312e81;
  --danger:#ef4444;--danger-soft:#fee2e2;--warn:#f59e0b;--warn-soft:#fef3c7;--info:#3b82f6;--info-soft:#dbeafe;
  --dark:#0f172a;--r:16px;--r-sm:11px;
  --shadow-s:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.06);
  --shadow:0 4px 14px rgba(15,23,42,.07),0 2px 4px rgba(15,23,42,.04);
  --shadow-l:0 24px 60px rgba(15,23,42,.22),0 8px 20px rgba(15,23,42,.12);
  --ease:cubic-bezier(.22,.9,.3,1);
  --font:"Inter","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0a1020;--surface:#111a2f;--surface2:#16213a;--surface3:#1c2946;--text:#e8edf7;--muted:#8fa0bd;--line:#223052;
  --accent:#818cf8;--accent-d:#6366f1;--accent-soft:#1e1b4b;--accent-ink:#c7d2fe;
  --danger:#f87171;--danger-soft:#3b1620;--warn:#fbbf24;--warn-soft:#3a2d0c;--info:#60a5fa;--info-soft:#14284a;
  --shadow-s:0 1px 2px rgba(0,0,0,.4);--shadow:0 6px 18px rgba(0,0,0,.35);--shadow-l:0 24px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;overflow:hidden;
  transition:background .3s var(--ease),color .3s var(--ease);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:1.2em;height:1.2em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
::selection{background:var(--accent-soft);color:var(--accent-ink)}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:76px 1fr;height:100vh;height:100dvh}
#app.kiosk{grid-template-columns:1fr}
.rail{background:var(--dark);color:#cbd5e1;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;z-index:5}
:root[data-theme="dark"] .rail{background:#070c18;border-right:1px solid var(--line)}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#22d3ee);display:grid;place-items:center;color:#fff;font-weight:900;font-size:19px;margin-bottom:10px;box-shadow:0 6px 18px rgba(16,185,129,.4)}
.nav{width:56px;padding:9px 0 7px;border:0;background:none;color:inherit;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;position:relative;transition:background .2s,color .2s,transform .2s var(--ease)}
.nav svg.i{width:22px;height:22px}
.nav:hover{background:rgba(255,255,255,.08);color:#fff}
.nav:active{transform:scale(.94)}
.nav.on{background:rgba(129,140,248,.2);color:#c7d2fe}
.nav .dot{position:absolute;top:5px;right:9px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;display:grid;place-items:center;font-weight:700}
.grow{flex:1}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.topbar h1{font-size:17px;margin:0;font-weight:750;letter-spacing:-.01em}
.topbar .sub{color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--surface3);font-size:12px;font-weight:600;color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--accent-ink)}
.pill.warn{background:var(--warn-soft);color:#92400e}
:root[data-theme="dark"] .pill.warn{color:#fcd34d}
.pill.bad{background:var(--danger-soft);color:#b91c1c}
:root[data-theme="dark"] .pill.bad{color:#fca5a5}
.pill.info{background:var(--info-soft);color:#1d4ed8}
:root[data-theme="dark"] .pill.info{color:#93c5fd}
.view{flex:1;min-height:0;overflow:auto;padding:18px 20px;animation:viewIn .28s var(--ease)}
.view.flush{padding:0;overflow:hidden}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:650;font-size:13.5px;box-shadow:var(--shadow-s);transition:transform .15s var(--ease),box-shadow .2s,background .2s,border-color .2s,opacity .2s;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:var(--shadow)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent-d));border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.38)}
.btn.primary:hover{filter:brightness(1.05);box-shadow:0 8px 22px rgba(99,102,241,.48)}
.btn.blue{background:linear-gradient(180deg,#3b82f6,#2563eb);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(37,99,235,.3)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface3);color:var(--text);box-shadow:none}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.lg{padding:14px 22px;font-size:16px;border-radius:14px}
.btn.xl{padding:18px 26px;font-size:18px;border-radius:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.icon{padding:9px;width:38px;height:38px}
.btn.icon.sm{width:30px;height:30px;padding:6px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.inp,select.inp,textarea.inp{width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);outline:none;transition:border-color .2s,box-shadow .2s,background .2s;min-width:0}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.inp.lg{padding:14px 16px;font-size:16px;border-radius:14px}
.search{position:relative;flex:1}
.search svg.i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:19px;height:19px}
.search .inp{padding-left:43px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-s)}
.card.pad{padding:16px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:12px}.bold{font-weight:700}.right{text-align:right}.mono{font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--surface3);padding:3px;border-radius:12px;gap:2px}
.seg button{border:0;background:none;padding:7px 13px;border-radius:9px;font-weight:650;color:var(--muted);font-size:13px;transition:all .2s var(--ease)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-s)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--surface);padding:7px 15px;border-radius:99px;font-weight:650;color:var(--muted);white-space:nowrap;transition:all .2s var(--ease);font-size:13px}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.38)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--surface3);color:var(--muted)}
.kbd{font:600 11px ui-monospace,Consolas,monospace;padding:2px 6px;border-radius:6px;background:var(--surface3);color:var(--muted);border:1px solid var(--line)}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:background .25s}
.switch span:before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--accent)}.switch input:checked+span:before{transform:translateX(18px)}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}

/* ---------- till ---------- */
.till{display:grid;grid-template-columns:minmax(0,1fr) 410px;height:100%;min-height:0}
.till .left{display:flex;flex-direction:column;min-width:0;min-height:0;padding:16px 18px 0 20px;gap:12px}
.grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;align-content:start;padding:3px 3px 20px}
.tile{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:13px 14px 12px;display:flex;flex-direction:column;gap:5px;min-height:112px;transition:transform .18s var(--ease),box-shadow .25s,border-color .2s;box-shadow:var(--shadow-s);animation:tileIn .35s var(--ease) both}
@keyframes tileIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.tile:active{transform:scale(.96)}
.tile .nm{font-weight:700;font-size:14.5px;line-height:1.25;letter-spacing:-.005em}
.tile .no{font-size:11px;color:var(--muted);font-weight:600}
.tile .pr{margin-top:auto;font-weight:800;font-size:16px;color:var(--accent-d)}
:root[data-theme="dark"] .tile .pr{color:var(--accent)}
.tile .st{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface3);color:var(--muted)}
.tile .st.low{background:var(--warn-soft);color:#92400e}
:root[data-theme="dark"] .tile .st.low{color:#fcd34d}
.tile .st.out{background:var(--danger-soft);color:#b91c1c}
.tile .fav{position:absolute;bottom:11px;right:11px;color:var(--warn);opacity:.85}
.tile.out{opacity:.5}
.tile .av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;margin-bottom:3px}
.tile.big{min-height:150px}.tile.big .nm{font-size:17px}.tile.big .pr{font-size:19px}.tile.big .av{width:46px;height:46px;font-size:18px}
.tile.flash{animation:flash .5s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(99,102,241,.7)}100%{box-shadow:0 0 0 18px rgba(99,102,241,0)}}
.cartp{display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);min-height:0}
.cartp .hd{padding:14px 18px 10px;display:flex;flex-direction:column;gap:10px}
.cartp .lines{flex:1;min-height:0;overflow:auto;padding:2px 12px 8px}
.cartp .ft{padding:12px 18px 16px;border-top:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 8px;border-radius:12px;animation:lineIn .28s var(--ease)}
@keyframes lineIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.line:hover{background:var(--surface2)}
.line .nm{font-weight:650;font-size:13.5px}
.line .sub{font-size:11.5px;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;background:var(--surface3);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:none;width:28px;height:30px;font-size:16px;font-weight:700;color:var(--muted);transition:background .15s,color .15s}
.stepper button:hover{background:var(--accent-soft);color:var(--accent-ink)}
.stepper input{width:34px;text-align:center;border:0;background:none;font-weight:750;outline:none;padding:0}
.tot{display:flex;justify-content:space-between;font-size:13.5px}
.tot.grand{font-size:15px;font-weight:700;align-items:baseline}
.tot.grand b{font-size:28px;letter-spacing:-.02em;color:var(--accent-d)}
:root[data-theme="dark"] .tot.grand b{color:var(--accent)}
.empty{display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px 20px;gap:8px}
.empty svg.i{width:46px;height:46px;opacity:.4}
.cardchip{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:linear-gradient(135deg,var(--accent-soft),var(--info-soft));border:1px solid var(--line);font-size:12.5px}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);z-index:1}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr{transition:background .15s}
.tbl tbody tr:hover td{background:var(--surface2)}
.tbl tr.click{cursor:pointer}
.tbl .r{text-align:right}
.scroll{overflow:auto;border-radius:var(--r)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.kpi:after{content:"";position:absolute;right:-24px;top:-24px;width:90px;height:90px;border-radius:50%;background:var(--accent-soft);opacity:.7}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:650;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .2s,border-color .2s}
.tabs button.on{color:var(--accent-d);border-color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.form .full{grid-column:1/-1}
.board{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:14px;align-items:start}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:220px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow-s);display:flex;flex-direction:column;gap:7px;animation:tileIn .3s var(--ease)}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bars .b i{width:100%;max-width:46px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,var(--accent),var(--accent-d));min-height:3px;transition:height .6s var(--ease)}
.bars .b span{font-size:11px;color:var(--muted)}.bars .b em{font-size:10.5px;font-style:normal;color:var(--muted)}

/* ---------- overlays ---------- */
#toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:200;pointer-events:none}
.toast{background:var(--dark);color:#fff;padding:11px 18px;border-radius:14px;font-weight:600;box-shadow:var(--shadow-l);animation:toastIn .35s var(--ease);max-width:90vw;display:flex;gap:9px;align-items:center}
.toast.err{background:#b91c1c}.toast.ok svg{color:#34d399}
.toast.out{animation:toastOut .3s var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.96)}}
.scrim{position:fixed;inset:0;background:rgba(8,13,28,.5);backdrop-filter:blur(5px);display:grid;place-items:center;z-index:100;animation:fade .2s;padding:16px}
.scrim.out{animation:fadeOut .2s forwards}
@keyframes fade{from{opacity:0}}@keyframes fadeOut{to{opacity:0}}
.modal{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-l);width:min(560px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;animation:modalIn .32s var(--ease);overflow:hidden;border:1px solid var(--line)}
.modal.wide{width:min(860px,100%)}.modal.xwide{width:min(1060px,100%)}.modal.narrow{width:min(420px,100%)}
.scrim.out .modal{animation:modalOut .2s forwards}
@keyframes modalIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes modalOut{to{opacity:0;transform:translateY(12px) scale(.97)}}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 6px}
.modal .mh h2{margin:0;font-size:19px;letter-spacing:-.01em}
.modal .mb{padding:10px 22px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--surface2)}
.overlay{position:fixed;inset:0;z-index:90;background:radial-gradient(1200px 700px at 15% 10%,#2b2a78 0,transparent 60%),radial-gradient(900px 600px at 90% 90%,#1e3a8a 0,transparent 55%),#070d1c;color:#fff;display:grid;place-items:center;padding:24px;animation:fade .35s}
.overlay .hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:980px;width:100%}
.overlay h1{font-size:clamp(30px,5vw,54px);margin:6px 0 2px;letter-spacing:-.03em;font-weight:850}
.overlay p{color:#a8b5d1;font-size:clamp(15px,2vw,19px);margin:0 0 26px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;width:100%}
.choice{border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);backdrop-filter:blur(8px);color:#fff;border-radius:26px;padding:34px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transition:transform .25s var(--ease),background .25s,border-color .25s;animation:modalIn .5s var(--ease) both}
.choice:nth-child(2){animation-delay:.08s}
.choice:hover{transform:translateY(-6px);background:rgba(255,255,255,.11);border-color:rgba(110,231,183,.7)}
.choice:active{transform:scale(.97)}
.choice svg.i{width:48px;height:48px;color:#c7d2fe}
.choice b{font-size:23px}.choice span{color:#a8b5d1;font-size:14.5px}
.choice.primary{background:linear-gradient(160deg,rgba(99,102,241,.38),rgba(99,102,241,.1))}
.corner{position:absolute;right:20px;bottom:18px}
.corner .btn{background:transparent;border:0;color:#6b7a99;box-shadow:none}
.corner .btn:hover{color:#fff}
.sheet-total{font-size:44px;font-weight:850;letter-spacing:-.03em;color:var(--accent-d);text-align:center}
:root[data-theme="dark"] .sheet-total{color:var(--accent)}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cam{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/10;display:grid;place-items:center}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:18% 12%;border:2.5px solid rgba(255,255,255,.65);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.32);pointer-events:none;transition:border-color .2s}
.cam .frame.hit{border-color:#34d399}
.cam .laser{position:absolute;left:14%;right:14%;height:2px;background:linear-gradient(90deg,transparent,#34d399,transparent);box-shadow:0 0 14px #34d399;animation:laser 2s ease-in-out infinite;pointer-events:none}
@keyframes laser{0%,100%{top:22%}50%{top:76%}}

function assignItemNumbers(ps) {

}
function normalize(s) {

/* ---------------------------------------------------------------- barcodes (Code 39) */
const CODE39 = {
  "0": "nnnwwnwnn", "1": "wnnwnnnnw", "2": "nnwwnnnnw", "3": "wnwwnnnnn", "4": "nnnwwnnnw", "5": "wnnwwnnnn", "6": "nnwwwnnnn", "7": "nnnwnnwnw",
  "8": "wnnwnnwnn", "9": "nnwwnnwnn", A: "wnnnnwnnw", B: "nnwnnwnnw", C: "wnwnnwnnn", D: "nnnnwwnnw", E: "wnnnwwnnn", F: "nnwnwwnnn",
  G: "nnnnnwwnw", H: "wnnnnwwnn", I: "nnwnnwwnn", J: "nnnnwwwnn", K: "wnnnnnnww", L: "nnwnnnnww", M: "wnwnnnnwn", N: "nnnnwnnww",
  O: "wnnnwnnwn", P: "nnwnwnnwn", Q: "nnnnnnwww", R: "wnnnnnwwn", S: "nnwnnnwwn", T: "nnnnwnwwn", U: "wwnnnnnnw", V: "nwwnnnnnw",
  W: "wwwnnnnnn", X: "nwnnwnnnw", Y: "wwnnwnnnn", Z: "nwwnwnnnn", "-": "nwnnnnwnw", ".": "wwnnnnwnn", " ": "nwwnnnwnn", "*": "nwnnwnwnn",
};
function code39svg(text, height = 40) {
  text = String(text || "").toUpperCase();
  if (!text || [...text].some(c => !CODE39[c] || c === "*")) return "";
  const n = 1, w = 2.5, gap = 1, quiet = 10;
  let x = quiet, rects = "";
  for (const ch of "*" + text + "*") {
    [...CODE39[ch]].forEach((el, i) => {
      const width = el === "w" ? w : n;
      if (i % 2 === 0) rects += `<rect x="${x}" y="0" width="${width}" height="${height}"/>`;
      x += width;
    });
    x += gap;
  }
  const total = x - gap + quiet;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${height}" preserveAspectRatio="none" shape-rendering="crispEdges" class="bc"><rect width="${total}" height="${height}" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
}
const normCode = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const maskCode = c => (c && c.length >= 8 ? c.slice(0, 3) + "****-" + c.slice(-4) : c || "");
function newCardCode() {
  const have = new Set(S.cards.map(c => normCode(c.code)));
  for (;;) {
    const a = crypto.getRandomValues(new Uint32Array(8));
    const raw = [...a].map(v => CARD_ALPHABET[v % CARD_ALPHABET.length]).join("");
    const code = `SC-${raw.slice(0, 4)}-${raw.slice(4)}`;
    if (!have.has(normCode(code))) return code;
  }
}

/* ---------------------------------------------------------------- totals */
function compute(cur = R.cur) {
  const rt = rate(cur);
  const lines = []; let subtotal = 0, cost = 0;
  for (const [name, qty] of Object.entries(R.cart)) {
    const p = findProduct(name); if (!p) continue;
    const amount = round2(p.price * qty / rt);
    lines.push({ item: name, no: p.item_no || "", qty, unit: round2(p.price / rt), amount, cost: p.cost || 0 });
    subtotal += amount; cost += (p.cost || 0) * qty;
  }
  subtotal = round2(subtotal);
  const code = (R.code || "").trim().toUpperCase();
  const comboDisc = typeof comboDiscount === "function" ? comboDiscount(rt) : 0;
  const discount = Math.min(subtotal, round2(subtotal * (S.discount_codes[code] || 0) + comboDisc));
  const card = activeCard();
  let cdisc = 0;
  if (card && card.discount > 0) cdisc = round2((subtotal - discount) * card.discount / 100);
  let redeem = 0, pointsUsed = 0;
  const c = R.customer, pv = S.point_value;
  if (c && R.redeem && (c.points || 0) > 0 && pv > 0) {
    redeem = round2(Math.max(Math.min(c.points * pv / rt, subtotal - discount - cdisc), 0));
    if (redeem > 0) pointsUsed = Math.min(c.points, Math.ceil(redeem * rt / pv - 1e-9));
  }
  const taxable = subtotal - discount - cdisc - redeem;
  const gst = round2(taxable * S.gst_rate);
  const total = round2(taxable + gst);
  let cardAmt = 0, cardPkr = 0;
  if (card && R.useBal && (card.balance || 0) > 0 && total > 0) {
    cardAmt = round2(Math.min(card.balance / rt, total));
    cardPkr = round2(Math.min(card.balance, cardAmt * rt));
  }
  const due = round2(total - cardAmt);
  const earn = c ? Math.floor(Math.floor(total * rt / 100) * S.loyalty_rate) : 0;
  return { lines, subtotal, discount, cdisc, redeem, pointsUsed, gst, total, code, cardAmt, cardPkr, due,
    cardCode: card ? card.code : "", earn, items: lines.reduce((a, l) => a + l.qty, 0), cost };
}
function validateCart(t) {
  if (!t.lines.length) return "Add at least one item to the order.";
  if (t.code && !(t.code in S.discount_codes)) return "Unknown discount code. Try " + Object.keys(S.discount_codes).join(", ") + ".";
  for (const l of t.lines) {
    const p = findProduct(l.item);
    if (p.stock != null && l.qty > p.stock) return p.stock <= 0 ? `${l.item} is out of stock.` : `Only ${p.stock} of ${l.item} left in stock.`;
  }
  if (R.type === "Delivery" && !R.address.trim()) return "Enter a delivery address.";
  return "";
}

/* ---------------------------------------------------------------- orders */
function buildOrder(t, pay) {
  const rt = rate(R.cur);
  const payments = [];
  if (t.cardAmt > 0) payments.push({ method: "Store Card", amount: t.cardAmt });
  let received = null, change = null;
  if (t.due > 0.005) {
    if (pay.split) {
      payments.push({ method: pay.mA, amount: pay.amtA }, { method: pay.mB, amount: round2(t.due - pay.amtA) });
    } else {
      payments.push({ method: pay.method, amount: t.due });
      if (pay.method === "Cash" && pay.recv != null) { received = pay.recv; change = round2(received - t.due); }
    }
  }
  if (!payments.length) payments.push({ method: "None", amount: 0 });
  const method = payments.length > 1 ? "Split" : payments[0].method;
  const breakdown = payments.length > 1 ? payments.map(p => `${p.method}:${p.amount.toFixed(2)}`).join(" + ") : "";
  const no = S.order_counter, cust = R.customer;
  return {
    order_no: no, timestamp: nowStr(), order_type: R.type, customer: cust ? cust.name : "", customer_id: cust ? cust.id : null,
    delivery_address: R.type === "Delivery" ? R.address.trim() : "", notes: R.notes.trim(), currency: R.cur, rate: rt,
    subtotal: t.subtotal, discount_code: t.code, discount: t.discount, redeem: t.redeem, points_used: t.pointsUsed, points_earned: t.earn,
    card_code: t.cardCode, card_discount: t.cdisc, card_paid: t.cardAmt, card_paid_pkr: t.cardPkr, gst: t.gst, total: t.total,
    status: R.type === "In-store" ? "Completed" : "Pending", payment_method: method, payment_breakdown: breakdown, payments,
    received, change, void_reason: "", employee: staffName(), items: t.lines.map(l => ({ ...l })),
  };
}
function commitOrder(order, t) {
  const no = order.order_no;
  t.lines.forEach(l => adjustStock(findProduct(l.item), -l.qty, `Sale #${pad(no, 4)}`));
  const cust = R.customer;
  if (cust) {
    cust.points = Math.max(0, (cust.points || 0) - t.pointsUsed) + t.earn;
    cust.last_visit = order.timestamp; order.points_balance = cust.points;
  }
  const card = activeCard();
  if (card) {
    if (t.cardPkr > 0) { card.balance = round2(Math.max(card.balance - t.cardPkr, 0)); cardLog(card, "Spend", -t.cardPkr, `Order #${pad(no, 4)}`); }
    card.last_used = order.timestamp; order.card_balance = card.balance;
  }
  S.orders.push(order); S.order_counter++; save();
}
function updateStatus(no, next, reason) {
  const o = orderByNo(no); if (!o) return;
  if (DEAD.includes(next) && !DEAD.includes(o.status)) {
    o.items.forEach(l => adjustStock(findProduct(l.item), l.qty, `${next} #${pad(o.order_no, 4)}`));
    const c = findCustomer(o.customer_id);
    if (c) c.points = Math.max(0, (c.points || 0) + (o.points_used || 0) - (o.points_earned || 0));
    if (o.card_code && o.card_paid_pkr) {
      const cd = cardByCode(o.card_code);
      if (cd) { cd.balance = round2((cd.balance || 0) + o.card_paid_pkr); cardLog(cd, "Refund", o.card_paid_pkr, `${next} order #${pad(o.order_no, 4)}`); }
    }
  }
  o.status = next;
  if (reason != null) o.void_reason = reason;
  save();
}

/* ---------------------------------------------------------------- drawer */
function drawerToday(date = todayStr()) {
  S.drawer[date] ||= { float: 0, moves: [], counted: null };
  return S.drawer[date];
}
function drawerCashIn(amount, note) { drawerToday().moves.push({ time: nowStr(), type: "In", amount: round2(amount), note, by: staffName() }); }
function drawerSummary(date = todayStr()) {
  const d = drawerToday(date);
  const sales = liveOrders(date).reduce((a, o) => a + cashPartPkr(o), 0);
  const sum = t => d.moves.filter(m => m.type === t).reduce((a, m) => a + m.amount, 0);
  const cin = sum("In"), cout = sum("Out"), ref = sum("Refund");
  const expected = d.float + sales + cin - cout - ref;
  return { float: d.float, sales, in: cin, out: cout, refund: ref, expected, counted: d.counted, diff: d.counted == null ? null : d.counted - expected, moves: d.moves };
}

/* ---------------------------------------------------------------- reports */
function buildSummary() {
  const live = liveOrders(), today = todayStr();
  const revenue = live.reduce((a, o) => a + pkr(o, "total"), 0);
  const profit = live.reduce((a, o) => a + orderProfit(o), 0);
  const tOrders = live.filter(o => o.timestamp.startsWith(today));
  const tRev = tOrders.reduce((a, o) => a + pkr(o, "total"), 0);
  const counts = {}, byType = {}, byPay = {}, byStatus = {}, byEmp = {};
  S.orders.forEach(o => { byStatus[o.status] = (byStatus[o.status] || 0) + 1; });
  live.forEach(o => {
    const tot = pkr(o, "total");
    byType[o.order_type] = (byType[o.order_type] || 0) + tot;
    payParts(o).forEach(([m, a]) => { byPay[m] = (byPay[m] || 0) + a; });
    const e = o.employee || "(none)"; byEmp[e] = (byEmp[e] || 0) + tot;
    o.items.forEach(l => { counts[l.item] = (counts[l.item] || 0) + l.qty; });
  });
  return { live, revenue, profit, tOrders, tRev, top: Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5), byType, byPay, byStatus, byEmp };
}
function last7() {

let audioCtx = null;
function sound(kind) {
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    const f = { add: 740, ok: 880, err: 180, done: 988 }[kind] || 660;
    o.frequency.value = f; o.type = kind === "err" ? "sawtooth" : "sine";
    g.gain.setValueAtTime(.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.12, audioCtx.currentTime + .01);
    g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + (kind === "done" ? .28 : .12));
    o.start(); o.stop(audioCtx.currentTime + .3);
  } catch (e) { /* no audio */ }
}
function toast(msg, err = false, ms = 2400) {
  const el = document.createElement("div");
  el.className = "toast " + (err ? "err" : "ok");
  el.innerHTML = (err ? ico("alert") : ico("check")) + `<span>${esc(msg)}</span>`;
  const box = $("#toasts");
  while (box.children.length > 3) box.firstChild.remove();
  box.appendChild(el);
  if (err) sound("err");
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 300); }, ms);
}
function download(name, text, type = "text/plain") {
  const a = document.createElement("a");

}

const layer = () => $("#layer");
const modals = [];
function modal(html, { cls = "", onMount, dismiss = true } = {}) {
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  layer().appendChild(scrim);
  let closed = false, resolve;
  const done = new Promise(r => (resolve = r));
  const m = {
    el: scrim.firstElementChild, scrim, done,
    close(v) {
      if (closed) return; closed = true;
      const i = modals.indexOf(m); if (i >= 0) modals.splice(i, 1);
      scrim.classList.add("out"); setTimeout(() => scrim.remove(), 190);
      if (m.onClose) m.onClose();
      resolve(v);
    },
  };
  m.dismiss = dismiss;
  scrim.addEventListener("mousedown", e => { if (e.target === scrim && dismiss) m.close(null); });
  scrim.addEventListener("click", e => { const x = e.target.closest("[data-close]"); if (x) m.close(x.dataset.close === "" ? null : x.dataset.close); });
  modals.push(m);
  if (onMount) onMount(m);
  const f = m.el.querySelector("[autofocus],input:not([type=hidden]),select,textarea");
  if (f && !("ontouchstart" in window)) setTimeout(() => f.focus(), 60);
  return m;
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && modals.length) { const m = modals[modals.length - 1]; if (m.dismiss) m.close(null); }
});
const mHead = (t, sub = "") => `<div class="mh"><div><h2>${t}</h2>${sub ? `<div class="muted small">${sub}</div>` : ""}</div><button class="btn ghost icon sm" data-close aria-label="Close">${ico("x")}</button></div>`;

function fieldHtml(f) {
  const id = "f_" + f.k, v = f.value ?? "";
  const cls = "field" + (f.full ? " full" : "");
  if (f.type === "check") return `<div class="${cls}"><label class="check"><span class="switch"><input type="checkbox" id="${id}" ${v ? "checked" : ""}><span></span></span><span>${f.label}</span></label></div>`;
  let input;
  if (f.type === "select") input = `<select class="inp" id="${id}">${f.options.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v) ? "selected" : ""}>${esc(lab)}</option>`; }).join("")}</select>`;
  else if (f.type === "textarea") input = `<textarea class="inp" id="${id}" rows="3" placeholder="${esc(f.placeholder || "")}">${esc(v)}</textarea>`;
  else input = `<input class="inp" id="${id}" type="${f.type || "text"}" value="${esc(v)}" placeholder="${esc(f.placeholder || "")}" ${f.step ? `step="${f.step}"` : ""} ${f.type === "number" ? 'inputmode="decimal"' : ""} autocomplete="off">`;
  return `<div class="${cls}"><label for="${id}">${f.label}</label>${input}${f.hint ? `<div class="muted small">${f.hint}</div>` : ""}</div>`;
}
function readFields(el, fields) {
  const out = {};
  for (const f of fields) {
    const n = el.querySelector("#f_" + f.k); if (!n) continue;
    if (f.type === "check") out[f.k] = n.checked;
    else if (f.type === "number") out[f.k] = n.value.trim() === "" ? null : parseFloat(n.value);
    else out[f.k] = n.value.trim();
  }
  return out;
}
/** Form dialog. Resolves with the values, or null when cancelled. validate(v) -> "" or an error message. */
function ask(title, fields, { ok = "Save", sub = "", validate, cls = "", danger = false, extra = "", onMount } = {}) {
  return new Promise(resolve => {
    const m = modal(`${mHead(title, sub)}<form class="mb"><div class="form">${fields.map(fieldHtml).join("")}</div>${extra}<div class="small" id="ask_err" style="color:var(--danger);min-height:16px"></div>
      <div class="row" style="justify-content:flex-end;gap:10px"><button type="button" class="btn" data-close>Cancel</button><button class="btn ${danger ? "danger solid" : "primary"}" type="submit">${ok}</button></div></form>`, { cls });
    m.el.querySelector("form").addEventListener("submit", e => {
      e.preventDefault();
      const v = readFields(m.el, fields);
      const msg = validate ? validate(v) : "";
      if (msg) { $("#ask_err", m.el).textContent = msg; sound("err"); return; }
      m.close(v);
    });
    m.done.then(v => resolve(v ?? null));
    if (onMount) onMount(m);
  });
}
function confirmBox(title, msg, { ok = "Confirm", danger = false } = {}) {
  return new Promise(resolve => {
    const m = modal(`${mHead(title)}<div class="mb"><div>${msg}</div></div><div class="mf"><button class="btn" data-close>Cancel</button><button class="btn ${danger ? "danger solid" : "primary"}" data-close="yes" autofocus>${ok}</button></div>`, { cls: "narrow" });
    m.done.then(v => resolve(v === "yes"));
  });
}
function info(title, html) { return modal(`${mHead(title)}<div class="mb">${html}</div><div class="mf"><button class="btn primary" data-close>OK</button></div>`, { cls: "narrow" }).done; }

  const r = handleScan(q, true);

/** Routes a scanned/typed code: receipt (staff only), store card, or product. Returns [ok, message]. */
function handleScan(text, quiet = false) {
  text = (text || "").trim(); const up = text.toUpperCase();
  if (up.startsWith("ORD-")) {
    if (R.mode === "customer") return [false, "Receipts can only be opened by staff"];
    const no = parseInt(up.slice(4), 10);
    if (isNaN(no)) return [false, `Not a valid receipt code: ${text}`];
    const o = orderByNo(no);
    if (!o) return [false, `Order #${pad(no, 4)} not found`];
    showReceipt(o); return [true, `Opened receipt #${pad(no, 4)}`];
  }
  const c = cardByCode(text);
  if (c) { return applyCard(text) ? [true, `${c.kind} applied`] : [false, cardProblem(c) || "That card can't be used"]; }
  for (const p of S.products) {
    if ((p.barcode && p.barcode.toUpperCase() === up) || String(p.item_no) === text) {
      if (p.stock != null && p.stock <= 0) return [false, `${p.name} is out of stock`];
      return addProduct(p, 1, true) ? (sound("add"), toast(`Added ${p.name}`, false, 1200), [true, `Added ${p.name}`]) : [false, `Not enough stock for ${p.name}`];
    }
  }
  return [false, `Unknown code: ${text}`];
}

  if (!r) return;

    card: R.card ? R.card.code : "", code: R.code, type: R.type, cur: R.cur, address: R.address, notes: R.notes });

ACT.held = () => {

function openPayment(t) {
  const cur = R.cur, kiosk = R.mode === "customer";
  const P = { method: "Cash", recv: "", split: false, mA: "Cash", amtA: "", mB: "Card" };
  const quick = [500, 1000, 5000, 10000];
  const m = modal(`${mHead("Payment", `${t.items} item${t.items === 1 ? "" : "s"}${R.customer ? " · " + esc(R.customer.name) : ""}`)}
    <div class="mb">
      <div><div class="muted small" style="text-align:center">AMOUNT DUE</div><div class="sheet-total mono">${money(t.due, cur)}</div>
      ${t.cardAmt > 0 ? `<div class="muted small" style="text-align:center">after ${money(t.cardAmt, cur)} paid with store card</div>` : ""}</div>
      <div id="payBody"></div><div class="small" id="payErr" style="color:var(--danger);min-height:16px;text-align:center"></div></div>
    <div class="mf"><button class="btn" data-close>Back</button><button class="btn primary lg" id="payGo" style="min-width:210px">${ico("check")} Complete sale</button></div>`, { cls: "narrow" });
  const body = $("#payBody", m.el);
  const methodSeg = (id, val) => `<div class="seg" id="${id}">${PAY_METHODS.map(x => `<button data-v="${x}" class="${val === x ? "on" : ""}">${x}</button>`).join("")}</div>`;
  const draw = () => {
    if (t.due <= 0.005) { body.innerHTML = `<div class="empty" style="padding:10px">${ico("card")}<b>Fully covered by the store card</b></div>`; return; }
    let h = `<div class="row between"><span class="lbl">Pay with</span>${kiosk ? "" : `<label class="check small"><span class="switch"><input type="checkbox" id="splitChk" ${P.split ? "checked" : ""}><span></span></span>Split payment</label>`}</div>`;
    if (!P.split) {
      h += methodSeg("mSeg", P.method);
      if (P.method === "Cash") h += `<div class="field"><label>Cash received</label><input class="inp lg" id="recv" inputmode="decimal" value="${esc(P.recv)}" placeholder="${fmt(t.due)}"></div>
        <div class="quick"><button class="btn" data-q="exact">Exact</button>${quick.map(q => `<button class="btn" data-q="${q}">${q.toLocaleString()}</button>`).join("")}</div><div id="chg" class="bold" style="text-align:center;min-height:24px"></div>`;
    } else {
      h += `<div class="form"><div class="field"><label>Method A</label>${methodSeg("mA", P.mA)}</div><div class="field"><label>Amount A</label><input class="inp" id="amtA" inputmode="decimal" value="${esc(P.amtA)}"></div>
        <div class="field"><label>Method B</label>${methodSeg("mB", P.mB)}</div><div class="field"><label>Remainder</label><div class="inp bold" id="rem" style="background:var(--surface3)">—</div></div></div>`;
    }
    body.innerHTML = h; bind(); updateChange();
  };
  const num = s => { const v = parseFloat(String(s).replace(/,/g, "")); return isNaN(v) ? null : v; };
  const updateChange = () => {
    const chg = $("#chg", m.el), rem = $("#rem", m.el);
    if (chg) { const r = num(P.recv); chg.innerHTML = r == null ? "" : r + 0.005 < t.due ? `<span style="color:var(--danger)">Short by ${money(t.due - r, cur)}</span>` : `<span style="color:var(--accent-d)">Change ${money(r - t.due, cur)}</span>`; }
    if (rem) { const a = num(P.amtA); rem.textContent = a == null ? "—" : money(t.due - a, cur); }
  };
  const bind = () => {
    $$("#mSeg button,#mA button,#mB button", m.el).forEach(b => b.addEventListener("click", () => {
      const id = b.parentElement.id; if (id === "mSeg") P.method = b.dataset.v; if (id === "mA") P.mA = b.dataset.v; if (id === "mB") P.mB = b.dataset.v; draw();
    }));
    const sc = $("#splitChk", m.el); if (sc) sc.addEventListener("change", () => { P.split = sc.checked; draw(); });
    const rv = $("#recv", m.el); if (rv) { rv.addEventListener("input", () => { P.recv = rv.value; updateChange(); }); rv.addEventListener("keydown", e => { if (e.key === "Enter") go(); }); }
    const aa = $("#amtA", m.el); if (aa) aa.addEventListener("input", () => { P.amtA = aa.value; updateChange(); });
    $$("[data-q]", m.el).forEach(b => b.addEventListener("click", () => { P.recv = b.dataset.q === "exact" ? String(t.due) : String(b.dataset.q); const r = $("#recv", m.el); r.value = P.recv; updateChange(); }));
  };
  const go = () => {
    const pay = { method: P.method, split: P.split, mA: P.mA, mB: P.mB, recv: null, amtA: 0 };
    if (t.due > 0.005) {
      if (P.split) {
        const a = num(P.amtA);
        if (a == null) return fail("Enter a valid amount for the first split payment.");
        if (a <= 0 || a >= t.due) return fail(`Split amount must be between 0 and the amount due (${money(t.due, cur)}).`);
        pay.amtA = round2(a);
      } else if (P.method === "Cash" && P.recv.trim()) {
        const r = num(P.recv); if (r == null) return fail("Cash received must be a number.");

  $("#payGo", m.el).addEventListener("click", go);
  draw();
}
function placeOrder(pay) {

  clearForm(); renderGrid(); renderTop();

  if (R.mode === "customer") customerReceipt(order);
  else { toast(`Order #${pad(order.order_no, 4)} placed · ${money(order.total, order.currency)}`); if (S.auto_receipt) showReceipt(order); }

async function printCardsFlow(cards) {
  if (!cards.length) { toast("Pick at least one card to print.", true); return; }
  const last = S.card_sheet || { per: 8, next: 0 }, n = cards.length;
  const r = await ask("Print cards", [
    { k: "per", label: "Cards per A4 page", type: "select", options: [["8", "8 per page (roomy margins)"], ["10", "10 per page (saves paper)"]], value: String(last.per || 8), full: true },
    { k: "slot", label: "Start at slot (1 = top-left)", type: "number", value: (last.next || 0) + 1, full: true,
      hint: last.next ? `Your last sheet stopped at slot ${last.next}, so this continues on it - no wasted paper. Slots go left to right, top to bottom. Using a fresh sheet? Enter 1.` : "Slots go left to right, top to bottom. Re-using a half-printed sheet? Enter its first empty slot." },
  ], { ok: `Print ${n} card${n > 1 ? "s" : ""}`, sub: `${n} card${n > 1 ? "s" : ""} will share the same pages`, validate: v => { const per = +v.per; return Number.isInteger(v.slot) && v.slot >= 1 && v.slot <= per ? "" : `Slot must be a whole number from 1 to ${per}.`; } });
  if (!r) return;
  const per = +r.per, skip = r.slot - 1, pages = Math.ceil((skip + n) / per);
  printHtml(cardsHtml(cards, { per, skip }));
  cards.forEach(c => { c.printed = true; });
  S.card_sheet = { per, next: (skip + n) % per }; save();
  toast(`${n} card${n > 1 ? "s" : ""} on ${pages} page${pages > 1 ? "s" : ""}` + (S.card_sheet.next ? ` · next free slot: ${S.card_sheet.next + 1}` : ""));
  if (R.view === "cards") renderView();
}
function labelsHtml(ps, copies = 1) {
  const items = ps.flatMap(p => Array(copies).fill(p));
  return pageHtml("Item labels", `<div class="labels">${items.map(p => {
    const code = p.barcode || p.item_no;
    return `<div class="label"><div class="n">${esc(p.name)}</div><div class="no">Item # ${esc(p.item_no)}</div>${code39svg(code, 36)}<div class="row between" style="display:flex;justify-content:space-between;align-items:baseline"><span class="no">${esc(code)}</span><span class="p">${money(p.price, "PKR")}</span></div></div>`;
  }).join("")}</div>`);
}

function createCards(v) {

      discount: member ? v.discount : 0, status: "Active", expires: v.expires || "", customer_id: null, last_used: "", created: nowStr(), log: [] };
    if (member) { let cu = S.customers.find(x => x.phone && x.phone === v.phone) || S.customers.find(x => x.name.toLowerCase() === v.holder.toLowerCase()); cu ||= addCustomer(v.holder, v.phone); c.customer_id = cu.id; }

  }
  if (v.cash && !member) drawerCashIn(round2(v.amount * out.length), `Gift card sale x${out.length}`);

}

/* =====================================================================
   CLOUD SYNC  -  Firebase Auth + Firestore over plain REST (no SDK)
   Documents:  pos/meta {n}  ·  pos/core {json}  ·  pos/logs {json}  ·  orders/{00000042} {no,u,json}
   Every device keeps a full local copy (works offline) and merges with the cloud:

   ===================================================================== */
const CLOUD_ON = !!(CONFIG.apiKey && CONFIG.projectId && !/PASTE|YOUR/i.test(CONFIG.apiKey + CONFIG.projectId));
const CLOUD_LOCAL = ["camera_index", "camera_id", "theme"];            // never shared between devices
const CLOUD_LOGS = ["stock_log", "archive", "closed_days", "drawer"];  // second document (keeps each under Firestore's 1 MB limit)
const CKEY = "storepos.cloud";

const C = { st: CLOUD_ON ? "sync" : "off", msg: "", user: "", last: 0, token: "", exp: 0, refresh: "", base: {}, ut: {}, sent: {}, since: 0, n: -1,

const J = JSON.stringify;

/* ---------------------------------------------------------------- 3-way merge */
function merge3(b, l, r, key, nb) {
  if (same(l, r)) return l;
  if (!nb && same(l, b)) return r;
  if (!nb && same(r, b)) return l;
  const isO = x => x && typeof x === "object" && !Array.isArray(x);
  if (Array.isArray(l) && Array.isArray(r)) {
    if (ARR_ID[key]) return mergeById(Array.isArray(b) ? b : [], l, r, ARR_ID[key], nb);
    const rs = new Set(r.map(cj)), bs = new Set((Array.isArray(b) ? b : []).map(cj)), out = r.slice();
    for (const x of l) { const s = cj(x); if (!rs.has(s) && !bs.has(s)) out.push(x); }
    if (out.length && out.every(x => x && typeof x.time === "string")) out.sort((p, q) => (p.time < q.time ? -1 : p.time > q.time ? 1 : 0));
    return key === "stock_log" && out.length > 1500 ? out.slice(-1500) : out;
  }
  if (isO(l) && isO(r)) {
    const bb = isO(b) ? b : {}, out = {};
    for (const k of new Set([...Object.keys(r), ...Object.keys(l)])) {
      const inL = k in l, inR = k in r, inB = k in bb;
      if (inL && inR) out[k] = merge3(bb[k], l[k], r[k], k, nb);
      else if (inL) { if (inB && !nb && same(l[k], bb[k])) continue; out[k] = l[k]; }   // removed remotely & untouched here -> drop
      else if (inR) { if (inB && !nb && same(r[k], bb[k])) continue; out[k] = r[k]; }   // removed here & untouched remotely -> drop
    }
    return out;
  }
  if (typeof l === "number" && typeof r === "number") {
    if (key === "order_counter" || key === "customer_counter") return Math.max(l, r);
    if (DELTA.has(key) && typeof b === "number" && !nb) { const v = r + (l - b); return key === "stock" ? Math.max(0, v) : round2(v); }
  }
  return nb ? r : l;     // both changed the same value: this device wins (it is the one saving right now)
}

  const mp = a => new Map(a.map(x => [x[idk], x]));

    if (seen.has(id)) continue; seen.add(id);

    if (li && ri) out.push(merge3(bi, li, ri, "#item", nb));
    else if (li) { if (bi && !nb && same(li, bi)) continue; out.push(li); }
    else if (ri) { if (bi && !nb && same(ri, bi)) continue; out.push(ri); }

  const local = () => { const a = localAnswer(text); AI.msgs.push({ role: "model", text: (a || LOCAL_HELP) + (a ? "\n\n_(answered offline from your store data)_" : "") }); };
  if (!navigator.onLine || !gKey()) { local(); drawAi(); return; }
  AI.busy = true; drawAi();
  try { AI.msgs.push({ role: "model", text: await geminiChat(AI.msgs.filter(m => !m.err)) }); }
  catch (e) { if (/reach Gemini/i.test(e.message || "")) local(); else AI.msgs.push({ role: "model", text: e.message || String(e), err: true }); }
  AI.busy = false; drawAi();
}

ACT.restore = () => $("#filepick").click();

/* =====================================================================
   CAMERA SCANNING  (BarcodeDetector when available, ZXing otherwise)
   ===================================================================== */
const ZX_URLS = ["https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js", "https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"];
let zxPromise = null;
function loadZXing() {
  if (window.ZXing) return Promise.resolve(window.ZXing);
  return (zxPromise ||= (async () => {
    for (const u of ZX_URLS) {
      try { await new Promise((res, rej) => { const s = document.createElement("script"); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); if (window.ZXing) return window.ZXing; } catch (e) { /* try next */ }
    }
    zxPromise = null; throw new Error("Couldn't load the barcode reader (check your internet connection).");
  })());
}
async function makeDecoder() {
  if ("BarcodeDetector" in window) {
    try {
      const sup = await BarcodeDetector.getSupportedFormats();
      if (sup.includes("code_39")) {
        const det = new BarcodeDetector({ formats: ["code_39", "code_128", "ean_13", "ean_8", "upc_a", "upc_e", "itf", "qr_code"].filter(f => sup.includes(f)) });
        return async video => (await det.detect(video)).map(b => b.rawValue).filter(Boolean);
      }
    } catch (e) { /* fall through to ZXing */ }
  }
  const Z = await loadZXing();
  const hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.ITF, Z.BarcodeFormat.QR_CODE]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  const reader = new Z.MultiFormatReader(); reader.setHints(hints);
  const cv = document.createElement("canvas"), ctx = cv.getContext("2d", { willReadFrequently: true });
  let flip = 0;
  return async video => {
    const vw = video.videoWidth, vh = video.videoHeight; if (!vw) return [];
    const out = [];
    for (const maxW of (flip++ % 2 ? [vw, 960] : [960, vw])) {
      const k = Math.min(1, maxW / vw); cv.width = Math.round(vw * k); cv.height = Math.round(vh * k);
      ctx.drawImage(video, 0, 0, cv.width, cv.height);
      try { const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv))); out.push(reader.decode(bmp).getText()); break; } catch (e) { /* none in this frame */ }
    }
    return out;
  };
}
function frameJpeg(video, maxSide = 1280) {
  const k = Math.min(1, maxSide / Math.max(video.videoWidth, video.videoHeight)), c = document.createElement("canvas");
  c.width = Math.round(video.videoWidth * k); c.height = Math.round(video.videoHeight * k);
  c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", .88).split(",")[1];
}
/** onCode(text) -> [ok, message]. One-shot windows close themselves after a good scan. */
async function openScanner({ title = "Scan with camera", hint = "", continuous = true, onCode, ai = false }) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast("This browser can't open the camera here. Use Chrome/Edge on https:// or localhost.", true); return null; }
  const def = hint || "Hold a barcode in front of the camera";
  const m = modal(`${mHead(title)}<div class="mb"><div class="cam"><video id="cv" playsinline muted autoplay></video><div class="frame" id="cframe"></div><div class="laser"></div><div class="msg" id="cmsg"><span class="shimmer"></span> Starting camera…</div></div>
    <div id="cstat" class="bold" style="text-align:center;min-height:42px;color:var(--muted)">${esc(def)}</div>
    <div class="row wrap">${ai ? `<button class="btn primary" id="aiBtn" style="flex:1">${ico("sparkles")} Identify products with AI photo</button><button class="btn" id="aiUndo">${ico("undo")} Undo last AI add</button>` : ""}<select class="inp" id="csel" style="width:auto;flex:${ai ? "0" : "1"}"></select></div>
    <div class="muted small" style="text-align:center">Good light · 15–25 cm away · hold steady for a moment</div></div><div class="mf"><button class="btn primary" data-close>Done</button></div>`, { cls: "wide" });
  const video = $("#cv", m.el), stat = $("#cstat", m.el), frame = $("#cframe", m.el), msg = $("#cmsg", m.el), sel = $("#csel", m.el);
  const say = (t, kind) => { stat.textContent = t; stat.style.color = kind === "ok" ? "var(--accent-d)" : kind === "err" ? "var(--danger)" : kind === "busy" ? "var(--info)" : "var(--muted)"; };
  let stream = null, alive = true, seen = {}, decode = null, lastAi = [], aiBusy = false;
  m.onClose = () => { alive = false; if (stream) stream.getTracks().forEach(t => t.stop()); };
  const start = async () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
    msg.classList.remove("hide"); msg.innerHTML = `<span class="shimmer"></span> Starting camera…`;
    try {
      const id = sel.value || S.camera_id || "";
      stream = await navigator.mediaDevices.getUserMedia({ video: id ? { deviceId: { exact: id }, width: { ideal: 1280 }, height: { ideal: 720 } } : { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      if (!alive) { stream.getTracks().forEach(t => t.stop()); return; }
      video.srcObject = stream; await video.play().catch(() => {}); msg.classList.add("hide");
      const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
      const cur = stream.getVideoTracks()[0].getSettings().deviceId;
      sel.innerHTML = devs.map((d, i) => `<option value="${esc(d.deviceId)}" ${d.deviceId === cur ? "selected" : ""}>${esc(d.label || "Camera " + (i + 1))}</option>`).join("");
      sel.style.display = devs.length > 1 ? "" : "none";
    } catch (e) {
      msg.innerHTML = `${ico("camera")}<br><b>Couldn't open the camera</b><br><span class="small">${esc(e.name === "NotAllowedError" ? "Allow camera access in the browser's address bar, then try again." : e.name === "NotFoundError" ? "No camera was found." : e.message || String(e))}</span>`;
    }
  };
  sel.addEventListener("change", () => { S.camera_id = sel.value; save(); start(); });
  start();
  try { decode = await makeDecoder(); } catch (e) { say(e.message, "err"); }
  const loop = async () => {
    if (!alive) return;
    if (decode && video.readyState >= 2 && !aiBusy) {
      try {
        const codes = await decode(video);
        for (const code of codes) {
          const now = Date.now(); if (now - (seen[code] || 0) < 1400) { seen[code] = now; continue; } seen[code] = now;
          frame.classList.add("hit"); setTimeout(() => frame.classList.remove("hit"), 500);
          const [ok, text] = await onCode(code); say(text, ok ? "ok" : "err"); sound(ok ? "ok" : "err");
          if (ok && !continuous) { setTimeout(() => m.close(), 450); return; }
        }
      } catch (e) { /* keep scanning */ }
    }
    setTimeout(loop, 130);
  };
  loop();
  if (ai) {
    $("#aiBtn", m.el).addEventListener("click", async () => {
      if (aiBusy) return;
      const ok = geminiReady(); if (!ok[0]) { say(ok[1], "err"); return; }
      if (!video.videoWidth) { say("No picture from the camera yet.", "err"); return; }
      aiBusy = true; $("#aiBtn", m.el).disabled = true; say("Analyzing the photo with Gemini…", "busy");
      try {
        const data = await geminiIdentify(frameJpeg(video), gKey(), S.gemini_model || GEMINI_DEFAULT_MODEL);
        const [good, text, added] = applyAiResult(data); lastAi = added; say(text, good ? "ok" : "err"); if (good) sound("done");
      } catch (e) { say(e.message || "Gemini failed.", "err"); }
      aiBusy = false; $("#aiBtn", m.el).disabled = false;
    });
    $("#aiUndo", m.el).addEventListener("click", () => {
      if (!lastAi.length) { say("Nothing to undo."); return; }
      lastAi.forEach(([n, q]) => { const left = (R.cart[n] || 0) - q; if (left > 0) R.cart[n] = left; else delete R.cart[n]; }); lastAi = []; onCartChanged(); say("Removed the last AI additions.");
    });
  }
  return m;
}
function scanToCart(focusAI) {
  const kiosk = R.mode === "customer";
  return openScanner({ title: kiosk ? "Scan items & cards" : "Scan items, cards & receipts", continuous: true, ai: true, onCode: c => handleScan(c),
    hint: focusAI ? "Put your products in front of the camera and press “Identify products with AI photo”. Barcodes still scan automatically." : "Scan item barcodes or store cards - scan the same item again to add another. Or press the AI button to identify products from a photo." });
}
ACT.scan = () => scanToCart(false);
ACT.aiscan = () => scanToCart(true);

/* =====================================================================
   GEMINI
   ===================================================================== */
const GEMINI_SCHEMA = { type: "OBJECT", properties: {
  items: { type: "ARRAY", items: { type: "OBJECT", properties: { item_no: { type: "STRING" }, name: { type: "STRING" }, quantity: { type: "INTEGER" }, confidence: { type: "NUMBER" } }, required: ["name", "quantity"] } },
  unknown: { type: "ARRAY", items: { type: "STRING" } } }, required: ["items"] };
function geminiPrompt(products) {
  return "You are the vision system of a store checkout. Look at the photo and identify every distinct product the customer is presenting, and count the units of each. Match each product to the store catalog below and answer with the catalog's exact item_no and name. If something is not in the catalog, put a short description of it in 'unknown'. Ignore hands, bags, tables and background. Do not guess products you cannot see, and give each item a confidence between 0 and 1.\n\nCATALOG (item_no | name):\n"
    + products.slice(0, 500).map(p => `${p.item_no} | ${p.name}`).join("\n");
}
function geminiErrorText(code, msg = "") {
  const low = (msg || "").toLowerCase();
  if (code === 400 && low.includes("api key")) return "Gemini says the API key isn't valid. Check it in Admin > Settings.";
  if (code === 400) return "Gemini couldn't use that request" + (msg ? `: ${msg}` : ".");
  if (code === 401 || code === 403) return "Gemini refused the API key. Check it (and that the Gemini API is enabled for it).";
  if (code === 404) return "Gemini couldn't find that model. Change the model name in Admin > Settings.";
  if (code === 429) return "Gemini is busy or the free quota is used up. Try again in a minute.";
  if (code >= 500) return "Gemini is having trouble right now. Try again in a moment.";
  return `Gemini error ${code}` + (msg ? `: ${msg}` : "");
}
async function geminiIdentify(b64, key, model) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
  const payload = { contents: [{ parts: [{ inline_data: { mime_type: "image/jpeg", data: b64 } }, { text: geminiPrompt(S.products) }] }],
    generationConfig: { temperature: 0, responseMimeType: "application/json", responseSchema: GEMINI_SCHEMA } };
  let res;
  try { res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": key }, body: JSON.stringify(payload) }); }
  catch (e) { throw new Error("Couldn't reach Gemini. Check the internet connection."); }
  if (!res.ok) { let msg = ""; try { msg = (await res.json()).error.message; } catch (e) { /* no body */ } throw new Error(geminiErrorText(res.status, msg)); }
  return parseGemini(await res.json());
}
function parseGemini(resp) {
  let out;
  try { out = resp.candidates[0].content.parts.map(p => p.text || "").join("").trim(); }
  catch (e) { throw new Error(resp && resp.promptFeedback && resp.promptFeedback.blockReason ? "Gemini blocked that picture." : "Gemini sent back nothing usable."); }
  if (out.startsWith("```")) out = out.replace(/^```[a-zA-Z]*\s*|\s*```$/g, "").trim();
  let data; try { data = JSON.parse(out); } catch (e) { throw new Error("Gemini's answer wasn't understood. Try again."); }
  if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("Gemini's answer wasn't understood. Try again.");
  return data;
}
/** Turns Gemini's answer into [[product, qty]] plus things that couldn't be matched. */
function matchProducts(data) {
  const byNo = new Map(S.products.map(p => [String(p.item_no), p])), byName = new Map(S.products.map(p => [p.name.toLowerCase(), p]));
  const unknown = (data.unknown || []).map(String), found = new Map();
  for (const it of data.items || []) {
    if (!it || typeof it !== "object") continue;
    const name = String(it.name || "").trim(), no = String(it.item_no || "").trim();
    let qty = parseInt(it.quantity, 10); qty = isNaN(qty) ? 1 : Math.max(1, Math.min(qty, 20));
    let conf = parseFloat(it.confidence); if (isNaN(conf)) conf = 1;
    let p = byName.get(name.toLowerCase()) || byNo.get(no);
    if (!p && name) p = fuzzy(name.toLowerCase(), [...byName.keys()]) && byName.get(fuzzy(name.toLowerCase(), [...byName.keys()]));
    if (!p || conf < 0.4) { unknown.push(name || no || "something"); continue; }
    found.set(p.name, [p, (found.get(p.name)?.[1] || 0) + qty]);
  }
  return [[...found.values()].map(([p, q]) => [p, Math.min(q, 20)]), unknown];
}
function fuzzy(s, list) { // similarity >= 0.8 using bigram overlap
  const bg = x => { const o = new Map(); for (let i = 0; i < x.length - 1; i++) { const k = x.slice(i, i + 2); o.set(k, (o.get(k) || 0) + 1); } return o; };
  const a = bg(s); let best = null, bs = 0;
  for (const c of list) { const b = bg(c); let hit = 0; a.forEach((n, k) => { hit += Math.min(n, b.get(k) || 0); }); const sc = (2 * hit) / Math.max(s.length - 1 + c.length - 1, 1); if (sc > bs) { bs = sc; best = c; } }
  return bs >= 0.8 ? best : null;
}
function geminiReady() {
  if (gKey()) return [true, ""];
  return [false, R.mode === "customer" ? "AI scan isn't set up yet. Please ask a staff member." : "Add a Gemini API key in Admin > Settings (get one at aistudio.google.com)."];
}
function applyAiResult(data) {
  const [matched, unknown] = matchProducts(data), added = [], short = [];
  for (const [p, q] of matched) (addProduct(p, q, true) ? added : short).push([p.name, q]);
  const parts = [];
  if (added.length) parts.push("Added " + added.map(([n, q]) => `${q} × ${n}`).join(", "));
  if (short.length) parts.push("Not enough stock: " + short.map(x => x[0]).join(", "));
  if (unknown.length) parts.push("Not recognised: " + unknown.slice(0, 4).join(", "));
  if (!parts.length) parts.push("Gemini didn't see any products. Move them closer and try again.");
  return [added.length > 0, parts.join(". "), added];
}

/* =====================================================================
   CUSTOMER / WORKER MODES
   ===================================================================== */
let RECEIPT_SECS = 20;
function removeOverlay() { if (R.overlay) { R.overlay.remove(); R.overlay = null; } }
function makeOverlay(html) {
  removeOverlay();
  const o = document.createElement("div"); o.className = "overlay"; o.innerHTML = html; document.body.appendChild(o); R.overlay = o; return o;
}
function showChooser() {
  const o = makeOverlay(`<div class="hero"><div class="logo" style="width:66px;height:66px;font-size:30px;border-radius:20px">${esc((S.store_name || "S").charAt(0).toUpperCase())}</div><h1>${esc(S.store_name)}</h1><p>Who is using this screen?</p>
    <div class="choices"><button class="choice primary" id="chCust">${ico("cart")}<b>I'm a Customer</b><span>Scan and pay for your items</span></button><button class="choice" id="chWork">${ico("lock")}<b>I'm a Worker</b><span>Full till, stock, cards and admin</span></button></div></div>`);
  $("#chCust", o).onclick = () => applyMode("customer"); $("#chWork", o).onclick = chooseWorker; $("#chCust", o).focus();
}
async function chooseWorker() { if (await workerUnlock()) applyMode("worker"); }
async function workerUnlock() {
  if (!S.worker_lock) return true;
  let found = null;
  const r = await ask("Worker mode", [{ k: "pw", label: "Staff or admin password", type: "password", full: true }], { ok: "Enter", cls: "narrow",
    validate: v => { found = S.employees.find(e => e.password === v.pw) || null; return found || v.pw === S.admin_password ? "" : "Incorrect password."; } });
  if (!r) return false;
  if (found) R.staff = found;
  return true;
}
function showWelcome() {
  const o = makeOverlay(`<div class="hero"><div class="logo" style="width:66px;height:66px;font-size:30px;border-radius:20px">${esc((S.store_name || "S").charAt(0).toUpperCase())}</div><h1>${esc(S.store_name)}</h1><p>Welcome! Scan your items to check out.</p>
    <div class="choices"><button class="choice primary" id="wStart">${ico("cart")}<b>Start shopping</b><span>Pick items or scan barcodes</span></button><button class="choice" id="wAi">${ico("sparkles")}<b>Scan with AI camera</b><span>Show your items to the camera</span></button></div></div>
    <div class="corner"><button class="btn" id="wStaff">${ico("lock")} Staff</button></div>`);
  $("#wStart", o).onclick = () => startShopping(false); $("#wAi", o).onclick = () => startShopping(true); $("#wStaff", o).onclick = ACT.toWorker; $("#wStart", o).focus();
}
function startShopping(ai) { removeOverlay(); touch(); if (ai) scanToCart(true); }
function goWelcome() {
  if (R.mode !== "customer") return;
  modals.slice().forEach(m => m.close());
  clearForm(); R.q = ""; R.cat = "All"; R.view = "till"; renderView(); showWelcome();
}
ACT.menu = async () => { if (Object.keys(R.cart).length && !(await confirmBox("Main menu", "Go back to the main menu? Your cart will be cleared.", { ok: "Go back" }))) return; goWelcome(); };
ACT.toCustomer = async () => { if (Object.keys(R.cart).length && !(await confirmBox("Customer mode", "Switch to customer mode? The current cart will be cleared.", { ok: "Switch" }))) return; applyMode("customer"); };
ACT.toWorker = async () => { if (await workerUnlock()) applyMode("worker"); };
function applyMode(mode) {
  removeOverlay(); modals.slice().forEach(m => m.close());
  R.mode = mode; clearForm(); R.q = ""; R.cat = "All"; R.view = "till"; R.adminOK = false;
  if (mode === "customer") { R.staff = null; renderShell(); touch(); showWelcome(); }
  else { renderShell(); }
}
function startMode() {
  const sm = S.startup_mode;
  if (sm === "Customer") applyMode("customer");
  else if (sm === "Worker") workerUnlock().then(ok => (ok ? applyMode("worker") : showChooser()));
  else showChooser();
}
function customerReceipt(o) {
  let left = RECEIPT_SECS;
  const m = modal(`<div style="text-align:center;padding:20px 22px 0"><div style="font-size:30px;font-weight:850;color:var(--accent-d)">Thank you!</div><div class="muted">Order #${pad(o.order_no, 4)} · ${money(o.total, o.currency)}</div></div>
    <div class="mb"><div class="receipt-prev"><iframe id="rframe" title="Receipt"></iframe></div><div class="muted" id="cdown" style="text-align:center"></div></div>
    <div class="mf"><button class="btn" id="rcPrint">${ico("print")} Print receipt</button><button class="btn primary lg" data-close>Done</button></div>`, { cls: "narrow", dismiss: false });
  const fr = $("#rframe", m.el); fr.srcdoc = receiptHtml(o); fr.onload = () => { try { fr.style.height = Math.min(fr.contentDocument.body.scrollHeight + 16, window.innerHeight * 0.5) + "px"; } catch (e) { /* ignore */ } };
  $("#rcPrint", m.el).onclick = () => printHtml(receiptHtml(o));
  const t = setInterval(() => { if (left <= 0) { m.close(); return; } $("#cdown", m.el).textContent = `Returning to the main menu in ${left}s`; left--; }, 1000);
  $("#cdown", m.el).textContent = `Returning to the main menu in ${left}s`; left--;
  m.onClose = () => { clearInterval(t); setTimeout(goWelcome, 60); };
}
function checkIdle() {
  if (R.mode !== "customer" || R.overlay) return;
  if (modals.length) { R.lastAct = Date.now(); return; }
  if (S.customer_idle > 0 && Date.now() - R.lastAct > S.customer_idle * 1000) goWelcome();
}

/* ---- staff sign-in (worker mode) ---- */
ACT.staff = async () => {
  if (R.staff) { if (await confirmBox("Sign out", `Sign out ${esc(R.staff.username)}?`, { ok: "Sign out" })) { R.staff = null; renderRail(); toast("Signed out"); } return; }
  if (!S.employees.length) { toast("No staff accounts yet. Add them in Admin > Staff.", true); return; }
  let f = null;
  const r = await ask("Staff sign in", [{ k: "u", label: "Username" }, { k: "p", label: "Password", type: "password" }], { ok: "Sign in", cls: "narrow",
    validate: v => { f = S.employees.find(e => e.username.toLowerCase() === v.u.toLowerCase() && e.password === v.p); return f ? "" : "Incorrect username or password."; } });
  if (r) { R.staff = f; renderRail(); toast(`Signed in as ${f.username}`); }
};

/* =====================================================================
   KEYBOARD + START
   ===================================================================== */
document.addEventListener("keydown", e => {
  if (R.overlay || modals.length) return;
  if (e.key === "F2") { e.preventDefault(); const q = $("#q"); if (q) { q.focus(); q.select(); } }
  if (e.key === "F7") { e.preventDefault(); scanToCart(true); }
  if (e.key === "F8") { e.preventDefault(); scanToCart(false); }
  if (e.key === "F9" || (e.ctrlKey && e.key === "Enter")) { e.preventDefault(); if (R.view === "till") ACT.charge(); }
  if (e.ctrlKey && e.key.toLowerCase() === "h" && R.mode === "worker" && R.view === "till") { e.preventDefault(); ACT.hold(); }
});
function init() {
  S = loadState(); applyTheme(); autoBackup();
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (S.theme === "auto") { applyTheme(); renderRail(); } });
  document.title = S.store_name + " · POS";
  R.mode = "worker"; renderShell();
  if (!window.__noAutoStart) { startMode(); cloud.start(); }
}
window.addEventListener("DOMContentLoaded", init);
